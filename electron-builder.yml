appId: app.jyu.nodex
productName: Nodex
directories:
  buildResources: resources
  output: dist
files:
- out/**/*
- package.json
- "!**/*.map"
- "!**/*.tsbuildinfo"
- "!**/webpack-stats.json"
- "!**/__snapshots__/**"
- "!**/__tests__/**"
- "!**/test/**"
- "!**/tests/**"
- "!**/*.test.*"
- "!**/*.spec.*"
- "!node_modules/@types/**"
- "!node_modules/node-pty/deps/**"
- "!node_modules/node-pty/scripts/**"
- "!node_modules/node-pty/src/**"
- "!node_modules/node-pty/third_party/**"
- "!node_modules/node-pty/typings/**"
- "!node_modules/node-pty/prebuilds/win32-*/**"
asarUnpack:
- "**/*.node"
npmRebuild: true
extraResources:
- from: resources/icon.png
  to: icon.png
- from: resources/nodex-notification.aiff
  to: nodex-notification.aiff
- from: .generated/codex-runtime/bin
  to: bin
  filter:
  - "**/*"
  - "!nodex-service"
- from: .generated/codex-runtime/agent-runtime
  to: agent-runtime
  filter:
  - "**/*"
extraFiles:
- from: resources/macos/app.jyu.nodex.background-service.core.plist
  to: Helpers/Nodex Service.app/Contents/Library/LaunchAgents/app.jyu.nodex.background-service.core.plist
- from: resources/macos/nodex-service-Info.plist
  to: Helpers/Nodex Service.app/Contents/Info.plist
- from: .generated/codex-runtime/bin/nodex-service
  to: Helpers/Nodex Service.app/Contents/MacOS/nodex-service
extraMetadata:
  main: out/main/bootstrap.js
protocols:
- name: Nodex Deep Link
  schemes:
  - nodex

# --- macOS ---
mac:
  icon: icon.icon
  minimumSystemVersion: 12.0.0
  target:
  - dmg
  - zip
  artifactName: "${productName}-${version}-${arch}.${ext}"
  category: public.app-category.productivity
  hardenedRuntime: true
  binaries:
  - Contents/Resources/bin/nodex
  - Contents/Resources/bin/nodex-core
  - Contents/Resources/agent-runtime/bin/interpreter
  - Contents/Resources/agent-runtime/bin/codex-code-mode-host
  - Contents/Resources/agent-runtime/codex-path/rg
  - Contents/Resources/agent-runtime/codex-resources/zsh/bin/zsh
  - Contents/Helpers/Nodex Service.app/Contents/MacOS/nodex-service
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Nodex uses your microphone for thread composer dictation.
  notarize: true

dmg:
  title: "${productName}"
  background: dmg-background.png
  iconSize: 128
  iconTextSize: 16
  contents:
  - x: 176
    y: 135
    type: file
  - x: 464
    y: 135
    type: link
    path: /Applications

# --- Auto-update / Release hosting ---
publish:
  provider: github
  owner: junyudev
  repo: nodex

