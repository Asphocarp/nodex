name: Landing Site Deployment

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact protected-main commit to deploy
        required: true
        type: string
      publish_updates:
        description: Project the verified Release Bundle appcasts with the site
        default: false
        required: false
        type: boolean
    secrets:
      landing_github_token:
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-landing-site
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy landing site
    runs-on: ubuntu-latest
    environment: landing-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:landing
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.publish_updates
        with:
          name: nodex-release-bundle-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/release-bundle

      - name: Check out the current published site
        env:
          GH_TOKEN: ${{ secrets.landing_github_token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "Missing NODEXAPP_GITHUB_IO_TOKEN secret." >&2
            exit 1
          fi
          gh auth setup-git
          git clone "https://github.com/NodexApp/NodexApp.github.io.git" "${RUNNER_TEMP}/target-site"

      - name: Project verified appcasts into the release site
        if: inputs.publish_updates
        run: |
          pnpm release:project:pages -- \
            --bundle "${RUNNER_TEMP}/release-bundle/release-bundle.json" \
            --existing-site-dir "${RUNNER_TEMP}/target-site" \
            --site-dir packages/landing/dist \
            --output "${RUNNER_TEMP}/appcast-projection.json"

      - name: Summarize appcast projection
        if: inputs.publish_updates
        shell: bash
        run: |
          {
            echo "## Sparkle Pages projection"
            echo
            echo "Target: NodexApp/NodexApp.github.io@$(git -C "${RUNNER_TEMP}/target-site" branch --show-current)"
            echo
            echo '```json'
            cat "${RUNNER_TEMP}/appcast-projection.json"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Publish built site
        env:
          GH_TOKEN: ${{ secrets.landing_github_token }}
          PUBLISH_UPDATES: ${{ inputs.publish_updates }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          target_dir="${RUNNER_TEMP}/target-site"
          if [[ "${PUBLISH_UPDATES}" == "true" ]]; then
            rsync -a --delete --exclude ".git" "packages/landing/dist/" "${target_dir}/"
          else
            rsync -a --delete --exclude ".git" --exclude "updates/" "packages/landing/dist/" "${target_dir}/"
          fi
          if [[ -z "$(git -C "${target_dir}" status --porcelain)" ]]; then
            echo "No landing-site changes to publish."
            exit 0
          fi

          git -C "${target_dir}" config user.name "github-actions[bot]"
          git -C "${target_dir}" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "${target_dir}" add --all
          git -C "${target_dir}" commit -m "deploy: refresh landing site from ${GITHUB_REPOSITORY}@${SOURCE_SHA}"
          git -C "${target_dir}" push origin HEAD
      - name: Verify published appcast bytes and enclosures
        if: inputs.publish_updates
        run: |
          pnpm release:verify:pages -- \
            --bundle "${RUNNER_TEMP}/release-bundle/release-bundle.json"
