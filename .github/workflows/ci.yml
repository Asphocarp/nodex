name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Run every conditional gate
        default: true
        required: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: classify
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.classify.outputs.app }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      landing_only: ${{ steps.classify.outputs.landing_only }}
      release_metadata: ${{ steps.classify.outputs.release_metadata }}
      runtime: ${{ steps.classify.outputs.runtime }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full || false }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          base_sha="${BASE_SHA}"
          if [[ -z "${base_sha}" || "${base_sha}" =~ ^0+$ ]]; then
            base_sha="$(git rev-list --max-parents=0 "${HEAD_SHA}")"
          fi
          arguments=(--base "${base_sha}" --head "${HEAD_SHA}" --output "${RUNNER_TEMP}/classification.json")
          if [[ "${FORCE_FULL}" == "true" ]]; then
            arguments+=(--full)
          fi
          node --no-warnings scripts/ci/classify-change.ts "${arguments[@]}"
          # shellcheck disable=SC2016
          node -e '
            const fs = require("node:fs");
            const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const keys = ["app", "docsOnly", "landingOnly", "releaseMetadata", "runtime"];
            const snake = (key) => key.replace(/[A-Z]/g, (letter) => `_${letter.toLowerCase()}`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, keys.map((key) => `${snake(key)}=${value[key]}`).join("\n") + "\n");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Change classification\n\n\`\`\`json\n${JSON.stringify(value, null, 2)}\n\`\`\`\n`);
          ' "${RUNNER_TEMP}/classification.json"

  static-contracts:
    name: static contracts
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Fetch pinned legacy migrator source
        shell: bash
        run: |
          source_sha="$(node -p 'require("./resources/legacy-profile-migrator.json").sourceCommit')"
          git fetch --no-tags --depth=1 origin "${source_sha}"
      - run: pnpm run verify:static

  rust:
    name: Rust
    if: needs.classify.outputs.docs_only != 'true' && needs.classify.outputs.landing_only != 'true'
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Install ripgrep for CLI functional tests
        shell: bash
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes ripgrep
          fi
      - name: Test the Rust workspace
        run: >-
          cargo test --workspace --all-features --
          --skip document::module::tests::canvas_incremental_hot_path_stays_bounded_at_twenty_thousand_elements
      - name: Test the isolated Canvas performance contract
        run: >-
          cargo test -p nodex-core --all-features --lib
          document::module::tests::canvas_incremental_hot_path_stays_bounded_at_twenty_thousand_elements --
          --exact --test-threads=1

  app-tests:
    name: app tests
    if: needs.classify.outputs.app == 'true'
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: cargo build -p nodex-core-server --all-targets
      - run: xvfb-run --auto-servernum pnpm test

  stress-tests:
    name: stress tests
    if: needs.classify.outputs.app == 'true'
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.1
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: cargo build -p nodex-core-server --all-targets
      - run: xvfb-run --auto-servernum pnpm run test:stress

  browser-e2e:
    name: browser and Electron E2E
    if: needs.classify.outputs.app == 'true'
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: cargo build -p nodex-core-server --all-targets
      - run: xvfb-run --auto-servernum pnpm test:browser
      - name: Run functional Electron E2E
        env:
          NODEX_SKIP_PERFORMANCE_GATES: "1"
        run: xvfb-run --auto-servernum pnpm test:e2e
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-e2e-failure-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  runtime-contracts:
    name: runtime contracts
    if: needs.classify.outputs.runtime == 'true'
    needs: classify
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify:runtime:mac

  required:
    name: required
    if: always()
    needs:
      - classify
      - static-contracts
      - rust
      - app-tests
      - stress-tests
      - browser-e2e
      - runtime-contracts
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected gate
        env:
          APP: ${{ needs.classify.outputs.app }}
          APP_TESTS_RESULT: ${{ needs.app-tests.result }}
          BROWSER_E2E_RESULT: ${{ needs.browser-e2e.result }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          DOCS_ONLY: ${{ needs.classify.outputs.docs_only }}
          LANDING_ONLY: ${{ needs.classify.outputs.landing_only }}
          RUNTIME: ${{ needs.classify.outputs.runtime }}
          RUNTIME_RESULT: ${{ needs.runtime-contracts.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          STATIC_RESULT: ${{ needs.static-contracts.result }}
          STRESS_TESTS_RESULT: ${{ needs.stress-tests.result }}
        shell: bash
        run: |
          set -euo pipefail
          require_success() {
            local name="$1"
            local result="$2"
            if [[ "${result}" != "success" ]]; then
              echo "${name} finished with ${result}; expected success." >&2
              exit 1
            fi
          }
          require_success classify "${CLASSIFY_RESULT}"
          require_success static-contracts "${STATIC_RESULT}"
          if [[ "${DOCS_ONLY}" != "true" && "${LANDING_ONLY}" != "true" ]]; then
            require_success rust "${RUST_RESULT}"
          fi
          if [[ "${APP}" == "true" ]]; then
            require_success app-tests "${APP_TESTS_RESULT}"
            require_success stress-tests "${STRESS_TESTS_RESULT}"
            require_success browser-e2e "${BROWSER_E2E_RESULT}"
          fi
          if [[ "${RUNTIME}" == "true" ]]; then
            require_success runtime-contracts "${RUNTIME_RESULT}"
          fi
