name: macOS Distribution

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact protected-main commit to build
        required: true
        type: string
      version:
        description: Stable application version
        required: true
        type: string
      tag:
        description: Stable application tag
        required: true
        type: string
      retention_days:
        description: Artifact retention period
        default: 14
        required: false
        type: number
      upload_sentry_sourcemaps:
        description: Upload source maps once from the arm64 production build
        default: false
        required: false
        type: boolean
    secrets:
      SPARKLE_ED25519_PRIVATE_KEY:
        description: Resolved only from the protected Sparkle finalization environment
        required: false
      apple_api_issuer:
        required: true
      apple_api_key_b64:
        required: true
      apple_api_key_id:
        required: true
      csc_key_password:
        required: true
      csc_link:
        required: true
      sentry_auth_token:
        required: false
      sentry_org:
        required: false
      sentry_project:
        required: false

permissions:
  contents: read

jobs:
  arm64:
    name: arm64 distribution
    runs-on: macos-26
    environment: macos-distribution
    env:
      RELEASE_ARCH: arm64
      RELEASE_OUTPUT: ${{ github.workspace }}/.generated/release-architecture/arm64
      RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.source_sha }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify exact clean release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${RELEASE_SOURCE_SHA}"
          test -z "$(git status --porcelain)"
          pnpm install --frozen-lockfile
          pnpm release:check -- --head "${RELEASE_SOURCE_SHA}" --output "${RUNNER_TEMP}/source.json"
          node -e '
            const source = require(process.argv[1]);
            if (source.version !== process.env.RELEASE_VERSION || source.tag !== process.env.RELEASE_TAG) {
              throw new Error("Release source identity does not match workflow inputs");
            }
          ' "${RUNNER_TEMP}/source.json"

      - name: Materialize macOS signing credentials
        env:
          APPLE_API_ISSUER: ${{ secrets.apple_api_issuer }}
          APPLE_API_KEY_B64: ${{ secrets.apple_api_key_b64 }}
          APPLE_API_KEY_ID: ${{ secrets.apple_api_key_id }}
          CSC_KEY_PASSWORD: ${{ secrets.csc_key_password }}
          CSC_LINK: ${{ secrets.csc_link }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${APPLE_API_KEY_B64}" || -z "${APPLE_API_KEY_ID}" || -z "${APPLE_API_ISSUER}" || -z "${CSC_LINK}" || -z "${CSC_KEY_PASSWORD}" ]]; then
            echo "Missing macOS signing or App Store Connect credentials." >&2
            exit 1
          fi
          pnpm exec tsx scripts/ci/macos-signing-keychain.ts prepare

      - name: Build and verify signed distribution
        env:
          APPLE_API_ISSUER: ${{ secrets.apple_api_issuer }}
          APPLE_API_KEY_ID: ${{ secrets.apple_api_key_id }}
          NODE_OPTIONS: --max-old-space-size=6144
          SENTRY_AUTH_TOKEN: ${{ inputs.upload_sentry_sourcemaps && secrets.sentry_auth_token || '' }}
          SENTRY_ORG: ${{ inputs.upload_sentry_sourcemaps && secrets.sentry_org || '' }}
          SENTRY_PROJECT: ${{ inputs.upload_sentry_sourcemaps && secrets.sentry_project || '' }}
          SENTRY_RELEASE: nodex@${{ inputs.version }}
          UPLOAD_SENTRY_SOURCEMAPS: ${{ inputs.upload_sentry_sourcemaps }}
        run: |
          if [[ "${UPLOAD_SENTRY_SOURCEMAPS}" == "true" && ( -z "${SENTRY_AUTH_TOKEN}" || -z "${SENTRY_ORG}" || -z "${SENTRY_PROJECT}" ) ]]; then
            echo "Production distribution requires complete Sentry source-map credentials." >&2
            exit 1
          fi
          pnpm release:build:mac -- \
            --arch "${RELEASE_ARCH}" \
            --source-sha "${RELEASE_SOURCE_SHA}" \
            --version "${RELEASE_VERSION}" \
            --output "${RELEASE_OUTPUT}"

      - name: Summarize architecture identity
        if: success()
        shell: bash
        run: |
          {
            echo "## arm64 distribution"
            echo
            echo '```json'
            cat "${RELEASE_OUTPUT}/architecture-build.json"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Remove macOS signing credentials
        if: always()
        shell: bash
        run: |
          if [[ -n "${NODEX_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "${NODEX_SIGNING_KEYCHAIN}" >/dev/null 2>&1 || true
            rm -f "${NODEX_SIGNING_KEYCHAIN}"
          fi
          if [[ -n "${APPLE_API_KEY:-}" ]]; then
            rm -f "${APPLE_API_KEY}"
          fi
          if [[ -n "${NODEX_SIGNING_CERTIFICATE:-}" ]]; then
            rm -f "${NODEX_SIGNING_CERTIFICATE}"
          fi

      - name: Upload arm64 architecture bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nodex-macos-arm64-${{ inputs.source_sha }}
          path: ${{ env.RELEASE_OUTPUT }}/
          compression-level: 0
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

  x64:
    name: x64 distribution
    runs-on: macos-26-intel
    environment: macos-distribution
    env:
      RELEASE_ARCH: x64
      RELEASE_OUTPUT: ${{ github.workspace }}/.generated/release-architecture/x64
      RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.source_sha }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify exact clean release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${RELEASE_SOURCE_SHA}"
          test -z "$(git status --porcelain)"
          pnpm install --frozen-lockfile
          pnpm release:check -- --head "${RELEASE_SOURCE_SHA}" --output "${RUNNER_TEMP}/source.json"
          node -e '
            const source = require(process.argv[1]);
            if (source.version !== process.env.RELEASE_VERSION || source.tag !== process.env.RELEASE_TAG) {
              throw new Error("Release source identity does not match workflow inputs");
            }
          ' "${RUNNER_TEMP}/source.json"

      - name: Materialize macOS signing credentials
        env:
          APPLE_API_ISSUER: ${{ secrets.apple_api_issuer }}
          APPLE_API_KEY_B64: ${{ secrets.apple_api_key_b64 }}
          APPLE_API_KEY_ID: ${{ secrets.apple_api_key_id }}
          CSC_KEY_PASSWORD: ${{ secrets.csc_key_password }}
          CSC_LINK: ${{ secrets.csc_link }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${APPLE_API_KEY_B64}" || -z "${APPLE_API_KEY_ID}" || -z "${APPLE_API_ISSUER}" || -z "${CSC_LINK}" || -z "${CSC_KEY_PASSWORD}" ]]; then
            echo "Missing macOS signing or App Store Connect credentials." >&2
            exit 1
          fi
          pnpm exec tsx scripts/ci/macos-signing-keychain.ts prepare

      - name: Build and verify signed distribution
        env:
          APPLE_API_ISSUER: ${{ secrets.apple_api_issuer }}
          APPLE_API_KEY_ID: ${{ secrets.apple_api_key_id }}
          NODE_OPTIONS: --max-old-space-size=6144
          SENTRY_AUTH_TOKEN: ''
          SENTRY_ORG: ''
          SENTRY_PROJECT: ''
          SENTRY_RELEASE: nodex@${{ inputs.version }}
        run: |
          pnpm release:build:mac -- \
            --arch "${RELEASE_ARCH}" \
            --source-sha "${RELEASE_SOURCE_SHA}" \
            --version "${RELEASE_VERSION}" \
            --output "${RELEASE_OUTPUT}"

      - name: Summarize architecture identity
        if: success()
        shell: bash
        run: |
          {
            echo "## x64 distribution"
            echo
            echo '```json'
            cat "${RELEASE_OUTPUT}/architecture-build.json"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Remove macOS signing credentials
        if: always()
        shell: bash
        run: |
          if [[ -n "${NODEX_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "${NODEX_SIGNING_KEYCHAIN}" >/dev/null 2>&1 || true
            rm -f "${NODEX_SIGNING_KEYCHAIN}"
          fi
          if [[ -n "${APPLE_API_KEY:-}" ]]; then
            rm -f "${APPLE_API_KEY}"
          fi
          if [[ -n "${NODEX_SIGNING_CERTIFICATE:-}" ]]; then
            rm -f "${NODEX_SIGNING_CERTIFICATE}"
          fi

      - name: Upload x64 architecture bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nodex-macos-x64-${{ inputs.source_sha }}
          path: ${{ env.RELEASE_OUTPUT }}/
          compression-level: 0
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

  finalize-sparkle:
    name: finalize ${{ matrix.arch }} Sparkle updates
    needs: [arm64, x64]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
          - arch: x64
            runner: macos-26-intel
    runs-on: ${{ matrix.runner }}
    environment: sparkle-feed-finalization
    env:
      RELEASE_ARCH: ${{ matrix.arch }}
      RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
      RELEASE_VERSION: ${{ inputs.version }}
      SPARKLE_OUTPUT: ${{ github.workspace }}/.generated/sparkle-update/${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nodex-macos-${{ matrix.arch }}-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/architecture

      - name: Fetch verified compatible update history
        id: history
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          history_dirs="$(pnpm --silent release:fetch:sparkle-history -- \
            --arch "${RELEASE_ARCH}" \
            --version "${RELEASE_VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --output "${RUNNER_TEMP}/sparkle-history")"
          echo "directories=${history_dirs}" >> "${GITHUB_OUTPUT}"

      - name: Finalize signed appcast and deltas
        env:
          SPARKLE_ED25519_PRIVATE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SPARKLE_ED25519_PRIVATE_KEY}"
          pnpm release:notes -- \
            --version "${RELEASE_VERSION}" \
            --output "${RUNNER_TEMP}/release-notes.md"
          published_at="$(git show -s --format=%cI "${RELEASE_SOURCE_SHA}")"
          history_args=()
          if [[ -n "${{ steps.history.outputs.directories }}" ]]; then
            history_args=(--history-dirs "${{ steps.history.outputs.directories }}")
          fi
          pnpm release:finalize:sparkle -- \
            --arch "${RELEASE_ARCH}" \
            --architecture-dir "${RUNNER_TEMP}/architecture" \
            "${history_args[@]}" \
            --notes "${RUNNER_TEMP}/release-notes.md" \
            --published-at "${published_at}" \
            --source-sha "${RELEASE_SOURCE_SHA}" \
            --version "${RELEASE_VERSION}" \
            --output "${SPARKLE_OUTPUT}"

      - name: Summarize signed update set
        run: cat "${SPARKLE_OUTPUT}/Nodex-${RELEASE_VERSION}-update-${RELEASE_ARCH}.json" >> "${GITHUB_STEP_SUMMARY}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nodex-sparkle-${{ matrix.arch }}-${{ inputs.source_sha }}
          path: ${{ env.SPARKLE_OUTPUT }}/
          compression-level: 0
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

  assemble:
    name: assemble Release Bundle
    needs: [arm64, x64, finalize-sparkle]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nodex-macos-arm64-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/architectures/arm64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nodex-macos-x64-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/architectures/x64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nodex-sparkle-arm64-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/updates/arm64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nodex-sparkle-x64-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/updates/x64

      - name: Assemble and verify Release Bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle="${RUNNER_TEMP}/release-bundle"
          pnpm release:assemble -- \
            --arm64-dir "${RUNNER_TEMP}/architectures/arm64" \
            --arm64-update-dir "${RUNNER_TEMP}/updates/arm64" \
            --x64-dir "${RUNNER_TEMP}/architectures/x64" \
            --x64-update-dir "${RUNNER_TEMP}/updates/x64" \
            --source-sha "${{ inputs.source_sha }}" \
            --version "${{ inputs.version }}" \
            --output "${bundle}"
          pnpm release:notes -- \
            --version "${{ inputs.version }}" \
            --output "${bundle}/release-notes.md"
          {
            echo "## Verified Release Bundle"
            echo
            echo '```json'
            cat "${bundle}/release-bundle.json"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload verified Release Bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nodex-release-bundle-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/release-bundle/
          compression-level: 0
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
