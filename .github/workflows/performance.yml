name: Performance CI

on:
  schedule:
    - cron: "15 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-ci
  cancel-in-progress: false

jobs:
  runtime-benchmark:
    name: Core client runtime benchmark
    runs-on: ubuntu-latest
    env:
      CI_TIMING_JOB: performance-runtime
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: ./.github/actions/setup-rust-ci
      - run: pnpm exec tsx scripts/ci/run-timed.ts --name runtime-benchmark -- pnpm run core:benchmark:rust
      - if: always()
        run: sccache --show-stats || true

  scale-contracts:
    name: Core scale contracts
    runs-on: ubuntu-latest
    env:
      CI_TIMING_JOB: performance-scale
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: ./.github/actions/setup-rust-ci
      - run: pnpm exec tsx scripts/ci/run-timed.ts --name scale-contracts -- pnpm run core:test:scale
      - if: always()
        run: sccache --show-stats || true

  complete:
    name: performance complete
    if: always()
    needs:
      - runtime-benchmark
      - scale-contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every performance gate
        env:
          CI_CLASSIFIER_RESULT: success
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: node --no-warnings scripts/ci/verify-required-gates.ts
