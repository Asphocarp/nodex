name: Landing Site

on:
  pull_request:
    paths:
      - "packages/landing/**"
      - ".github/workflows/landing-site.yml"
      - "CHANGELOG.md"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches:
      - main
    paths:
      - "packages/landing/**"
      - ".github/workflows/landing-site.yml"
      - "CHANGELOG.md"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build landing site
        run: pnpm run build:landing
