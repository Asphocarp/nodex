name: Set up Playwright Chromium
description: Restore the locked Playwright browser and install missing runner dependencies.
runs:
  using: composite
  steps:
    - name: Cache Playwright browsers
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}
        restore-keys: |
          playwright-${{ runner.os }}-
    - name: Install Chromium and system dependencies
      shell: bash
      run: pnpm exec playwright install --with-deps chromium
