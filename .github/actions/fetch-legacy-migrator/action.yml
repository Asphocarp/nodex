name: Fetch locked legacy migrator source
description: Make the pinned legacy migrator source commit available to build and test jobs.
runs:
  using: composite
  steps:
    - name: Resolve pinned legacy migrator source
      id: migrator-source
      shell: bash
      run: |
        source_sha="$(pnpm exec tsx -e 'import { LEGACY_PROFILE_MIGRATOR_SOURCE_COMMIT } from "./scripts/legacy-profile-migrator-artifacts.ts"; console.log(LEGACY_PROFILE_MIGRATOR_SOURCE_COMMIT)')"
        echo "source_sha=${source_sha}" >> "${GITHUB_OUTPUT}"
    - name: Fetch pinned legacy migrator source
      shell: bash
      run: |
        git fetch --no-tags --depth=1 origin "${{ steps.migrator-source.outputs.source_sha }}"
