name: Run stress test suites
description: Provision the complete locked test environment and execute every stress tier.
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-vite-plus
    - run: vp install --frozen-lockfile
      shell: bash
    - uses: ./.github/actions/setup-rust-ci
    - uses: ./.github/actions/setup-playwright
    - name: Run stress suites
      shell: bash
      run: vp exec tsx scripts/ci/run-timed.ts --name stress-tests -- xvfb-run --auto-servernum vp run test:stress
    - name: Show Rust compiler cache statistics
      if: always()
      shell: bash
      run: sccache --show-stats || true
