name: Run stress test suites
description: Provision the complete locked test environment and execute every stress tier.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .node-version
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
    - run: pnpm install --frozen-lockfile
      shell: bash
    - uses: ./.github/actions/setup-rust-ci
    - uses: ./.github/actions/setup-playwright
    - name: Run stress suites
      shell: bash
      run: pnpm exec tsx scripts/ci/run-timed.ts --name stress-tests -- xvfb-run --auto-servernum pnpm run test:stress
    - name: Show Rust compiler cache statistics
      if: always()
      shell: bash
      run: sccache --show-stats || true
