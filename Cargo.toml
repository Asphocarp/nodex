[workspace]
members = [
  "crates/nodex-cli",
  "crates/nodex-core",
  "crates/nodex-core-contracts",
  "crates/nodex-core-protocol",
  "crates/nodex-core-server",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"

[workspace.dependencies]
nodex-core-contracts = { path = "crates/nodex-core-contracts" }
nodex-core-protocol = { path = "crates/nodex-core-protocol" }
fs2 = "0.4.3"
getrandom = "0.3.4"
hex = "0.4.3"
http-body-util = "0.1.3"
hyper = { version = "1.10.1", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
rusqlite = { version = "=0.40.1", default-features = false, features = ["backup", "bundled", "hooks", "limits", "trace"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
thiserror = "2.0.17"
tokio = { version = "1.52.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
utoipa = "=5.5.0"
yrs = { version = "=0.27.3", features = ["sync", "small-client"] }

[workspace.lints.rust]
unsafe_code = "forbid"
